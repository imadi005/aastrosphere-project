<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aastrosphere — Numerology guidance by Pankajj Kumar Mishra">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aastrosphere">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F5F0E8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aastrosphere</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="shortcut icon" type="image/png" href="icons/Icon-192.png">
  <style>
    body {
      margin: 0;
      background-color: #F5F0E8;
      overscroll-behavior: none;
    }
    /* Loading screen */
    #loading {
      position: fixed;
      inset: 0;
      background: #F5F0E8;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 16px;
    }
    #loading img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
    }
    #loading p {
      font-family: serif;
      font-size: 18px;
      color: #9D7213;
      letter-spacing: 2px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="Aastrosphere">
    <p>AASTROSPHERE</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

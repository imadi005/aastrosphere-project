name: aastrosphere
description: "Aastrosphere — Numerology companion app"
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.3+1

  # UI
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  pinput: ^5.0.0

  url_launcher: ^6.2.6

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_analytics: ^12.5.0
  cloud_firestore: ^6.6.1

  # State
  flutter_riverpod: ^2.5.1

  # Utils
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  http: ^1.2.1
  workmanager: ^0.9.0+3
  cupertino_icons: ^1.0.6

  # Web
  flutter_web_plugins:
    sdk: flutter

  # PDF Generation
  pdf: ^3.11.0
  path_provider: ^2.1.2
  open_filex: ^4.3.2

  # In-app purchases
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FDDE8A"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - shorebird.yaml

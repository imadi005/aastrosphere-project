workflows:
  ios-release:
    name: Aastrosphere — iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile_app
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aastrosphere.app
      vars:
        BUNDLE_ID: "com.aastrosphere.app"
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  android-release:
    name: Aastrosphere — Android Release
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: mobile_app
    environment:
      flutter: stable
      groups:
        - android_signing
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - aastrosphere.pankajj@gmail.com
        notify:
          success: true
          failure: true
